<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPlate · Wireframes</title>
<!-- fonts + reset (hoisted from each screen's <helmet>) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Gaegu:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Gaegu', cursive; background: #efece4; color: #2a2a28; }
  /* top tab-bar shell that merges the two screens into one document */
  .dc-appbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 24px; background: #f3efe6; border-bottom: 2.5px solid #2a2a28;
    box-shadow: 0 3px 0 rgba(42,42,40,.08);
  }
  .dc-brand { font: 700 30px/1 'Caveat', cursive; }
  .dc-tabs { display: flex; gap: 8px; }
  .dc-tab {
    font: 700 15px 'Gaegu', cursive; padding: 8px 15px; cursor: pointer;
    border: 2px solid #2a2a28; border-radius: 11px 9px 11px 9px; background: #fff; color: #2a2a28;
    box-shadow: 2px 2px 0 rgba(42,42,40,.12);
  }
  .dc-tab[data-active="true"] { background: #2a2a28; color: #fff; }
  .dc-spacer { flex: 1; }
  .dc-notes { display: flex; align-items: center; gap: 7px; font: 700 14px 'Gaegu', cursive; cursor: pointer; user-select: none; }
  .dc-notes input { width: 16px; height: 16px; accent-color: #cf4a2f; cursor: pointer; }
  .dc-badge {
    font: 600 15px 'Caveat', cursive; border: 2px solid #2a2a28; border-radius: 9px 11px 9px 12px;
    padding: 5px 11px; transform: rotate(-2deg); background: #d8ecd5;
  }
</style>
</head>
<body>
  <div class="dc-appbar">
    <span class="dc-brand">SmartPlate</span>
    <div class="dc-tabs">
      <button class="dc-tab" data-target="screen-weekly" data-active="true">▦ Weekly Plan</button>
      <button class="dc-tab" data-target="screen-setup" data-active="false">🔒 Setup & Rules</button>
    </div>
    <span class="dc-spacer"></span>
    <label class="dc-notes"><input type="checkbox" id="dc-notes" checked> ✎ design notes</label>
    <span class="dc-badge">self-contained · offline</span>
  </div>

  <div class="dc-screen" id="screen-weekly" data-template="tpl-weekly" data-logic="logic-weekly"></div>
  <div class="dc-screen" id="screen-setup" data-template="tpl-setup" data-logic="logic-setup" style="display:none;"></div>

  <!-- ===== screen templates (interpreted by the runtime below) ===== -->
  <template id="tpl-weekly">
<div style="font-family:'Gaegu',cursive; background:#efece4; background-image:radial-gradient(#d7d2c5 1.1px, transparent 1.1px); background-size:22px 22px; min-height:100vh; color:#2a2a28; padding:34px 40px 90px;">

  <div style="max-width:1320px; margin:0 auto;">

  <!-- HEADER -->
  <div style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:18px;">
    <div>
      <div style="display:flex; align-items:baseline; gap:14px;">
        <span style="font:700 46px/1 'Caveat',cursive;">SmartPlate</span>
        <span style="font:700 20px/1 'Gaegu',cursive; color:#7a746a;">· Weekly Plan</span>
      </div>
      <svg width="320" height="11" style="display:block; margin:2px 0 0 2px;"><path d="M2 6 Q 80 1 160 6 T 318 5" stroke="#cf4a2f" stroke-width="3" fill="none" stroke-linecap="round"></path></svg>
      <div style="font:400 18px 'Gaegu',cursive; color:#56524a; margin-top:8px; max-width:660px;">First tell the agent <b>when</b> you want to eat — days &amp; meal windows. It optimises only those, then shows the week as a <b>calendar grid</b> or a <b>command dashboard</b>.</div>
    </div>
    <div style="font:600 17px 'Caveat',cursive; color:#2a2a28; border:2px solid #2a2a28; border-radius:9px 11px 9px 12px; padding:7px 13px; transform:rotate(-2.5deg); background:#f6e9b8;">lo-fi wireframe · v1</div>
  </div>

  <!-- ============ STEP 1 · WINDOW SELECTOR (interactive, drives the plan) ============ -->
  <div style="background:#fff; border:2.5px solid #2a2a28; border-radius:16px 16px 14px 16px; box-shadow:5px 6px 0 rgba(42,42,40,.10); padding:16px 20px; margin-top:22px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;">
      <div>
        <div style="font:700 25px 'Caveat',cursive;">1 · When should SmartPlate plan?</div>
        <div style="font:400 15px 'Gaegu',cursive; color:#56524a; margin-top:2px; max-width:560px;">Pick your meal windows and set each window's <b>time</b>. Tap a cell to cycle <b>▢ deliver → ⌂ cook → ⊘ skip</b> — skip is how you say "not this window". The agent optimises <b>only the meals you deliver or cook</b>; everything below recomputes live.</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:7px;">
        {{ weekToggleEl }}
        <span style="font:700 17px 'Caveat',cursive;">{{ weekLabel }} · Chennai</span>
      </div>
    </div>

    {{ selectorEl }}

    <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:14px; border-top:2px dashed #cfc9bd; padding-top:13px;">
      <span style="font:700 16px 'Gaegu',cursive; padding:7px 13px; border:2px solid #2a2a28; border-radius:11px; background:#f3efe6;">{{ sessions }} sessions planned</span>
      <span style="font:400 14px 'Gaegu',cursive; color:#7a746a;">tap a cell: ▢ deliver → ⌂ cook → ⊘ skip · ⊘ dashed = not eating</span>
      <div style="flex:1; min-width:230px;">
        <div style="display:flex; justify-content:space-between; font:700 13px 'Gaegu',cursive;"><span>₹{{ spent }} spent</span><span style="color:{{ leftColor }};">₹{{ left }} left</span></div>
        <div style="height:13px; border:2px solid #2a2a28; border-radius:8px; background:#fff; overflow:hidden; margin-top:3px;">{{ budgetFillSel }}</div>
        <div style="font:400 11px 'Gaegu',cursive; color:#7a746a;">of ₹2,000 cap · derived live from your selection</div>
      </div>
      <button onClick="{{ goGrid }}" style="font:700 15px 'Gaegu',cursive; padding:10px 16px; border:2px solid #2a2a28; border-radius:12px 10px 12px 10px; background:#fff; color:#2a2a28; box-shadow:2px 2px 0 rgba(42,42,40,.12); cursor:pointer;">See the plan ↓</button>
    </div>
  </div>
  <sc-if value="{{ notes }}" hint-placeholder-val="{{ true }}"><div style="font:600 18px 'Caveat',cursive; color:#cf4a2f; transform:rotate(-1.2deg); margin:10px 0 0 6px;">↳ the "when to order" selection moved up here, to the front. Toggle a window and the grid, the dashboard and the burn-down all re-optimise.</div></sc-if>

  <!-- constraint-conflict prompt: appears only when picks blow the budget cap -->
  {{ conflictEl }}

  <!-- ============ BUDGET — nested horizon + recommended band (inverse optimisation) ============ -->
  <div style="background:#fff; border:2.5px solid #2a2a28; border-radius:16px 16px 14px 16px; box-shadow:5px 6px 0 rgba(42,42,40,.10); padding:20px 24px; margin-top:18px;">
    <div style="font:700 25px 'Caveat',cursive;">Budget <span style="font:400 14px 'Gaegu',cursive; color:#7a746a;">— set the horizon, and see what your week should cost</span></div>
    {{ nestedBudgetEl }}
    <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:20px; border-top:2px dashed #cfc9bd; padding-top:16px;">
      <div style="font:700 21px 'Caveat',cursive;">Recommended <span style="font:400 14px 'Gaegu',cursive; color:#7a746a;">— priced from your sessions, nutrition target &amp; nearby places</span></div>
      <span style="font:700 13px 'Gaegu',cursive; padding:5px 11px; border:2px solid #2f6d4a; border-radius:9px; background:#eef3ec; color:#2f6d4a;">suggested floor ★4.3</span>
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:14px;">
      <div style="flex:1; min-width:180px; border:2px solid #2a2a28; border-radius:13px 11px 13px 11px; padding:11px 13px; background:#f6f4ee;">
        <div style="font:700 12px 'Gaegu',cursive; color:#a8a294;">FLOOR</div>
        <div style="font:700 26px 'Caveat',cursive;">₹1,420</div>
        <div style="font:400 12px 'Gaegu',cursive; color:#7a746a;">cheapest week that still hits your nutrition</div>
      </div>
      <div style="flex:1; min-width:180px; border:2px solid #2a2a28; border-radius:13px 11px 13px 11px; padding:11px 13px; background:#fff;">
        <div style="font:700 12px 'Gaegu',cursive; color:#a8a294;">USUAL</div>
        <div style="font:700 26px 'Caveat',cursive;">₹1,650</div>
        <div style="font:400 12px 'Gaegu',cursive; color:#7a746a;">your normal week (popular ⭐ picks)</div>
      </div>
      <div style="flex:1; min-width:180px; border:2px solid #cf4a2f; border-radius:13px 11px 13px 11px; padding:11px 13px; background:#fdf1ec;">
        <div style="font:700 12px 'Gaegu',cursive; color:#cf4a2f;">VARIETY ✦</div>
        <div style="font:700 26px 'Caveat',cursive;">₹1,950</div>
        <div style="font:400 12px 'Gaegu',cursive; color:#7a746a;">room to try 2 new dishes this week</div>
      </div>
    </div>
    <div style="font:400 13px 'Gaegu',cursive; color:#56524a; margin-top:10px;">↔ Trade-off: <b>+₹300</b> buys 2 new dishes · <b>−₹230</b> means one cook day or a skip · rain can add ~25%.</div>
  </div>
  <sc-if value="{{ notes }}" hint-placeholder-val="{{ true }}"><div style="font:600 18px 'Caveat',cursive; color:#cf4a2f; transform:rotate(-1.2deg); margin:10px 0 0 6px;">↳ inverse optimisation: instead of guessing a cap, the agent prices the week three ways. Pushing the ★ floor past the suggestion is what makes the budget jump.</div></sc-if>

  <!-- ============ TABS (only the two you liked) ============ -->
  <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:24px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <button onClick="{{ goGrid }}" style="font:700 17px 'Gaegu',cursive; padding:9px 16px; border:2px solid #2a2a28; border-radius:12px 10px 12px 10px; background:#fff; color:#2a2a28; box-shadow:3px 3px 0 rgba(42,42,40,.12); cursor:pointer;">▦ Calendar grid</button>
      <sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}"><div style="height:5px; width:90%; background:#cf4a2f; border-radius:4px;"></div></sc-if>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px;">
      <button onClick="{{ goDash }}" style="font:700 17px 'Gaegu',cursive; padding:9px 16px; border:2px solid #2a2a28; border-radius:12px 10px 12px 10px; background:#fff; color:#2a2a28; box-shadow:3px 3px 0 rgba(42,42,40,.12); cursor:pointer;">◳ Command dashboard</button>
      <sc-if value="{{ isDash }}" hint-placeholder-val="{{ false }}"><div style="height:5px; width:90%; background:#cf4a2f; border-radius:4px;"></div></sc-if>
    </div>
  </div>

  <!-- ==================================================================== -->
  <!-- ============ CALENDAR GRID ============ -->
  <!-- ==================================================================== -->
  <sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
  <div style="margin-top:22px;">
    <div style="font:700 26px 'Caveat',cursive; color:#2a2a28;">Calendar grid <span style="font:400 17px 'Gaegu',cursive; color:#7a746a;">— the whole week as a matrix; paused windows show greyed</span></div>

    <!-- legend: every glyph spelled out once, so the dense cards are decodable without docs -->
    <div style="display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-top:12px; padding:10px 13px; border:2px solid #2a2a28; border-radius:12px; background:#fbf9f3;">
      <span style="font:700 13px 'Gaegu',cursive; color:#7a746a; letter-spacing:.5px;">WHAT THE SYMBOLS MEAN</span>
      <span style="font:400 13px 'Gaegu',cursive;"><b style="display:inline-block; min-width:20px; text-align:center; border:1.5px solid #2a2a28; border-radius:5px; background:#2a2a28; color:#fff;">▢</b> deliver</span>
      <span style="font:400 13px 'Gaegu',cursive;"><b style="display:inline-block; min-width:20px; text-align:center; border:1.5px solid #2a2a28; border-radius:5px;">⌂</b> cook at home</span>
      <span style="font:400 13px 'Gaegu',cursive;"><b style="display:inline-block; min-width:20px; text-align:center; border:1.5px dashed #8a8478; border-radius:5px; background:#f3efe6; color:#8a8478;">⊘</b> skip <span style="color:#7a746a;">(not eating this window)</span></span>
      <span style="font:400 13px 'Gaegu',cursive;"><b>↻ spin</b> = swap for the next-best pick</span>
      <span style="font:400 13px 'Gaegu',cursive;"><b>menu ▾</b> = browse the ranked options</span>
      <span style="font:400 13px 'Gaegu',cursive;">🏠 home · 💼 work · ✈ travel <span style="color:#7a746a;">(where you'll be — sets what delivers)</span></span>
      <span style="font:400 13px 'Gaegu',cursive;">⭐ your usual · ✦ a new pick the agent is trying</span>
    </div>

    <div style="display:flex; flex-wrap:wrap; gap:38px; align-items:flex-start; margin-top:16px;">

      <!-- DESKTOP -->
      <div style="flex:0 0 auto;">
        <div style="font:700 13px 'Gaegu',cursive; color:#a8a294; letter-spacing:2px; margin-bottom:8px;">DESKTOP</div>
        <div style="width:1180px; background:#fff; border:2.5px solid #2a2a28; border-radius:16px 16px 14px 16px; box-shadow:5px 6px 0 rgba(42,42,40,.10); overflow:hidden;">
          <div style="display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:2px solid #2a2a28; background:#f3efe6;">
            <span style="width:11px; height:11px; border:1.5px solid #2a2a28; border-radius:50%;"></span>
            <span style="width:11px; height:11px; border:1.5px solid #2a2a28; border-radius:50%;"></span>
            <span style="width:11px; height:11px; border:1.5px solid #2a2a28; border-radius:50%;"></span>
            <span style="margin-left:10px; font:400 13px 'Gaegu',cursive; color:#7a746a; border:1.5px solid #cfc9bd; border-radius:7px; padding:2px 12px; background:#fff;">smartplate.app / week</span>
          </div>
          <!-- rail -->
          <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 18px; border-bottom:2px dashed #cfc9bd;">
            <div>
              <span style="font:700 12px 'Gaegu',cursive; padding:4px 10px; border:2px solid #2a2a28; border-radius:9px; background:#2a2a28; color:#fff;">BALANCED MODE</span>
              <span style="font:400 15px 'Gaegu',cursive; color:#56524a; margin-left:10px;">{{ weekLabel }} · {{ sessions }} sessions</span>
              <div style="font:400 13px 'Gaegu',cursive; color:#2f6d4a; margin-top:3px;">Best taste-for-money that stays on your nutrition target. <span style="color:#a8a294;">(Tight Week = cheapest on-target · Comfort = best your budget allows)</span></div>
            </div>
            <div style="min-width:260px;">
              <div style="display:flex; justify-content:space-between; font:700 14px 'Gaegu',cursive;"><span>₹{{ spent }} spent</span><span style="color:{{ leftColor }};">₹{{ left }} left</span></div>
              <div style="height:14px; border:2px solid #2a2a28; border-radius:9px; background:#fff; overflow:hidden; margin-top:3px;">{{ budgetFillGrid }}</div>
              <div style="font:400 12px 'Gaegu',cursive; color:#7a746a; margin-top:2px;">of ₹2,000 weekly cap</div>
            </div>
            <div style="display:flex; gap:8px;">
              <button onClick="{{ reoptimiseUnpinned }}" title="Re-roll only the non-pinned slots — your 🔒 pinned favourites stay put" style="font:700 14px 'Gaegu',cursive; padding:8px 13px; border:2px solid #2a2a28; border-radius:11px 9px 11px 9px; background:#fff; color:#2a2a28; box-shadow:2px 2px 0 rgba(42,42,40,.15); cursor:pointer;">{{ reoptLabel }}</button>
              <button style="font:700 14px 'Gaegu',cursive; padding:8px 13px; border:2px solid #2a2a28; border-radius:11px 9px 11px 9px; background:#2a2a28; color:#fff; box-shadow:2px 2px 0 rgba(42,42,40,.22); cursor:pointer;">Auto-order ▶</button>
            </div>
          </div>
          <!-- 7-col grid (interactive: each card has inline ↻ spin + browse) -->
          <div style="padding:14px 16px;">
            {{ welcomeBackEl }}
            {{ planStateEl }}
            {{ gridEl }}
            {{ usualFirstEl }}
            {{ extraOrderEl }}
            <!-- insight tiles -->
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:13px; border-top:2px dashed #cfc9bd;">
              <div style="font:700 13px 'Gaegu',cursive; padding:7px 11px; border:2px solid #2a2a28; border-radius:11px 9px 11px 9px; background:{{ capBg }};">{{ capLabel }}</div>
              <div style="font:700 13px 'Gaegu',cursive; padding:7px 11px; border:2px solid #2a2a28; border-radius:11px 9px 11px 9px; background:#fff;">{{ sessions }} sessions · {{ delivered }} deliver · {{ cooked }} cook</div>
              <div style="font:700 13px 'Gaegu',cursive; padding:7px 11px; border:2px solid #2a2a28; border-radius:11px 9px 11px 9px; background:#fdf1ec;" title="usual = a favourite outlet (⭐) · new = something the agent is introducing (✦)">{{ varietyStr }}</div>
              <div style="font:700 13px 'Gaegu',cursive; padding:7px 11px; border:2px solid #2a2a28; border-radius:11px 9px 11px 9px; background:#fff;">≈1,620 kcal/day <span style="color:#7a746a;">· target {{ kcalTargetStr }}</span></div>
              <div style="font:700 13px 'Gaegu',cursive; padding:7px 11px; border:2px solid #2a2a28; border-radius:11px 9px 11px 9px; background:#eef3ec;">surge saved ₹30</div>
              <div style="font:700 13px 'Gaegu',cursive; padding:7px 11px; border:2px solid #2a2a28; border-radius:11px 9px 11px 9px; background:#eef3ec;">allergens 0 conflicts ✓</div>
            </div>
          </div>
        </div>
        <sc-if value="{{ notes }}" hint-placeholder-val="{{ true }}"><div style="font:600 18px 'Caveat',cursive; color:#cf4a2f; transform:rotate(-1.2deg); margin:12px 0 0 6px; max-width:1180px;">↳ everything visible at once. Don't like a pick? <b>↻ spin</b> for the next-best option, <b>menu ▾</b> to choose from the ranked list, or flip <b>▢ / ⌂ / ⊘</b> to order, cook, or skip that slot. The <b>🏠/💼/✈ area chip</b> sets where you'll be — switch to Travel and only grab-and-go is serviceable; an area with no outlet falls back to cook/skip. Each day shows a <b>kcal allowance</b> that drains as you pick heavier. Budget &amp; burn-down re-derive instantly (red if you blow the cap).</div></sc-if>
      </div>

      <!-- MOBILE -->
      <div style="flex:0 0 auto;">
        <div style="font:700 13px 'Gaegu',cursive; color:#a8a294; letter-spacing:2px; margin-bottom:8px;">MOBILE</div>
        <div style="width:300px; background:#fff; border:3px solid #2a2a28; border-radius:34px; box-shadow:5px 6px 0 rgba(42,42,40,.10); overflow:hidden;">
          <div style="display:flex; justify-content:center; padding:8px;"><span style="width:80px; height:6px; background:#2a2a28; border-radius:4px;"></span></div>
          <div style="padding:6px 14px 18px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font:700 19px 'Caveat',cursive;">SmartPlate</span>
              <span style="font:700 10px 'Gaegu',cursive; padding:3px 8px; border:2px solid #2a2a28; border-radius:8px; background:#2a2a28; color:#fff;">BALANCED</span>
            </div>
            <div style="display:flex; justify-content:space-between; font:700 13px 'Gaegu',cursive; margin-top:10px;"><span>₹{{ spent }} / ₹2,000</span><span style="color:{{ leftColor }};">₹{{ left }} left</span></div>
            <div style="height:12px; border:2px solid #2a2a28; border-radius:8px; background:#fff; overflow:hidden; margin-top:3px;">{{ budgetFillMob }}</div>
            <!-- day chips → that day's meals (interactive: tap a day, spin/mode each meal) -->
            {{ mobGridEl }}
            <button style="width:100%; font:700 15px 'Gaegu',cursive; padding:10px; border:2px solid #2a2a28; border-radius:12px 10px 12px 10px; background:#2a2a28; color:#fff; box-shadow:2px 2px 0 rgba(42,42,40,.22); cursor:pointer; margin-top:12px;">Auto-order this week ▶</button>
          </div>
        </div>
        <sc-if value="{{ notes }}" hint-placeholder-val="{{ true }}"><div style="font:600 18px 'Caveat',cursive; color:#cf4a2f; transform:rotate(-1.2deg); margin:12px 0 0 6px; max-width:300px;">↳ phone trades the matrix for a day-picker — tap a day, see its meals, and ↻ spin / ▢⌂⊘ switch each one. Days past the cap tint red.</div></sc-if>
      </div>

    </div>
  </div>
  </sc-if>

  <!-- ==================================================================== -->
  <!-- ============ COMMAND DASHBOARD ============ -->
  <!-- ==================================================================== -->
  <sc-if value="{{ isDash }}" hint-placeholder-val="{{ false }}">
  <div style="margin-top:22px;">
    <div style="font:700 26px 'Caveat',cursive; color:#2a2a28;">Command dashboard <span style="font:400 17px 'Gaegu',cursive; color:#7a746a;">— status at a glance, tell it what to change, watch the budget burn down</span></div>

    <div style="display:flex; flex-wrap:wrap; gap:38px; align-items:flex-start; margin-top:16px;">

      <!-- DESKTOP -->
      <div style="flex:0 0 auto;">
        <div style="font:700 13px 'Gaegu',cursive; color:#a8a294; letter-spacing:2px; margin-bottom:8px;">DESKTOP</div>
        <div style="width:1180px; background:#fff; border:2.5px solid #2a2a28; border-radius:16px 16px 14px 16px; box-shadow:5px 6px 0 rgba(42,42,40,.10); overflow:hidden;">
          <div style="display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:2px solid #2a2a28; background:#f3efe6;">
            <span style="width:11px; height:11px; border:1.5px solid #2a2a28; border-radius:50%;"></span>
            <span style="width:11px; height:11px; border:1.5px solid #2a2a28; border-radius:50%;"></span>
            <span style="width:11px; height:11px; border:1.5px solid #2a2a28; border-radius:50%;"></span>
            <span style="margin-left:10px; font:400 13px 'Gaegu',cursive; color:#7a746a; border:1.5px solid #cfc9bd; border-radius:7px; padding:2px 12px; background:#fff;">smartplate.app / week</span>
          </div>
          <div style="padding:18px 20px;">
            <div style="display:flex; gap:16px; align-items:stretch;">
              <!-- hero -->

  <!-- ===== per-screen component logic (class Component extends DCLogic) ===== -->
<script type="text/x-dc" id="logic-weekly">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'grid', week: 'this', sel: this.defaultSel(), picks: this.defaultSkips(), browse: null, mobDay: 1, areaOverride: {}, qty: {}, addons: {}, spice: {}, horizon: 'week',
      // 🔒 pinned slots (key 'i-w' → true) survive a "re-optimise unpinned"; off-plan extras
      // are one-off orders that write to the budget + kcal ledger (§6.2). welcomeBack toggles
      // the returning-after-a-gap reconcile banner (§3.1).
      pins: {}, extras: [], welcomeBack: false, planPhase: 'live',
      // user-editable window times (24h HH:MM) — were hardcoded labels before
      times: { B: '08:30', L: '13:00', D: '20:30' } };
  }

  // ---- location primitive: serviceability gate per area ----
  areaMeta() {
    return { home: { g: '🏠', label: 'Home · Adyar' }, work: { g: '💼', label: 'Work · T.Nagar' }, transit: { g: '✈', label: 'Travel' } };
  }
  // time-of-day default: lunch near Work, breakfast/dinner near Home
  defaultArea(w) { return w === 'L' ? 'work' : 'home'; }
  activeArea(i, w) { return this.state.areaOverride[i + '-' + w] || this.defaultArea(w); }
  cycleArea(i, w) {
    const order = ['home', 'work', 'transit'];
    const next = order[(order.indexOf(this.activeArea(i, w)) + 1) % order.length];
    const k = i + '-' + w;

<script type="text/x-dc" id="logic-setup">
class Component extends DCLogic {
  state = { tab: 'form', bmr: { sex: 'F', age: 29, ht: 168, wt: 62, act: 1.55, goal: -110 }, favs: ['Murugan Idli', 'A2B', 'Sangeetha'],
    // ⚡ rule template gallery (§4.2): which suggested rules are on, and whether the
    // fill-in-the-blank gallery is open + the slots the user has chosen.
    ruleOn: { lunch: true, dinner: true, lowbudget: true, gym: true, travel: true, weekend: false },
    galleryOpen: false, galleryScope: 0, galleryNudge: 0 };

  // ---- favourite restaurants + the repeat-ordering insight ----
  favPool() { return ['Murugan Idli', 'A2B', 'Sangeetha', 'Ponnusamy', 'Anjappar', 'Jr. Kuppanna', 'Saravana Bhavan']; }
  addFav() { const next = this.favPool().find((p) => !this.state.favs.includes(p)); if (next) this.setState((s) => ({ favs: [...s.favs, next] })); }
  removeFav(name) { this.setState((s) => ({ favs: s.favs.filter((f) => f !== name) })); }
  favsPanel() {
    const h = React.createElement;
    const favs = this.state.favs;
    const share = Math.max(52, 82 - (favs.length - 3) * 4); // more favourites → flatter concentration
    const chip = (name) => h('span', { key: name, style: { display: 'inline-flex', alignItems: 'center', gap: '6px', font: "700 13px 'Gaegu',cursive", padding: '5px 8px 5px 11px', border: '2px solid #b8860b', borderRadius: '9px', background: '#fbf4dc', color: '#7a5a12' } },
      '⭐ ' + name,
      h('button', { onClick: () => this.removeFav(name), title: 'remove', style: { font: "700 12px 'Gaegu',cursive", width: '18px', height: '18px', border: 'none', borderRadius: '50%', background: '#e9d9a8', color: '#7a5a12', cursor: 'pointer', lineHeight: '1' } }, '×'));
    const canAdd = this.favPool().some((p) => !favs.includes(p));
    return h('div', null,
      h('div', { style: { font: "700 16px 'Gaegu',cursive" } }, '⭐ Your favourite restaurants ', h('span', { style: { font: "400 13px 'Gaegu',cursive", color: '#7a746a' } }, '— pinned outlets the agent leans on')),
      h('div', { style: { display: 'flex', gap: '7px', flexWrap: 'wrap', alignItems: 'center', marginTop: '9px' } },
        ...favs.map(chip),
        canAdd ? h('button', { onClick: () => this.addFav(), style: { font: "700 13px 'Gaegu',cursive", padding: '5px 11px', border: '2px dashed #b8860b', borderRadius: '9px', background: '#fff', color: '#7a5a12', cursor: 'pointer' } }, '+ add') : null),
      h('div', { style: { font: "400 13px/1.4 'Gaegu',cursive", color: '#56524a', marginTop: '11px', maxWidth: '640px' } },
        'Why this matters — behavioural research on food choice: people keep a small ',
        h('b', null, '“consideration set” of ~4–6 places'),
        ' and a big share of orders concentrate there. Across your last ', h('b', null, '142 orders'), ', ',
        h('b', { style: { color: '#7a5a12' } }, '≈' + share + '%'),
        ' came from these ' + favs.length + '. So the agent boosts their signature dishes, but ',
        h('b', null, 'spaces them out'), ' (no repeat within 3 days) so favourites don’t become fatigue — and ⭐-stars them on the weekly plan.'));
  }

  // ---- ⚡ rule template gallery (§4.2): templates + toggles, not raw syntax ----
  toggleRule(k) { this.setState((s) => ({ ruleOn: { ...s.ruleOn, [k]: !s.ruleOn[k] } })); }
  toggleGallery() { this.setState((s) => ({ galleryOpen: !s.galleryOpen })); }
  galScopes() { return ['💼 Work · lunch', '🏠 Home · dinner', '🏋 Gym day', '✈ Travel day', '📅 Weekend', '💸 low day-budget']; }
  galNudges() { return ['cap ₹150', '+25 g protein', 'boost ♥ favourites', 'grab-and-go only', 'switch to Tight Week', 'unlock a treat']; }
  cycleGal(key, listLen) { this.setState((s) => ({ [key]: ((s[key] || 0) + 1) % listLen })); }
  // a small fill-in-the-blank gallery: "When [scope ▾] then [nudge ▾]" — chips, never raw logic
  ruleGallery() {
    const h = React.createElement;
    if (!this.state.galleryOpen) return null;
    const scopes = this.galScopes(), nudges = this.galNudges();
    const sc = scopes[this.state.galleryScope % scopes.length], nu = nudges[this.state.galleryNudge % nudges.length];
    const slot = (txt, onClick) => h('button', { onClick, style: { font: "700 13px 'Gaegu',cursive", padding: '5px 11px', border: '2px solid #2a2a28', borderRadius: '8px', background: '#fff', cursor: 'pointer' } }, txt + ' ▾');
    return h('div', { style: { marginTop: '9px', padding: '11px 13px', border: '2px solid #b8702a', borderRadius: '11px', background: '#fbf6ea' } },
      h('div', { style: { font: "700 13px 'Gaegu',cursive", color: '#9a5e1f', marginBottom: '7px' } }, 'Template gallery ', h('span', { style: { font: "400 12px 'Gaegu',cursive", color: '#7a746a' } }, '— fill in the blanks; pick from chips, no syntax to write')),
      h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' } },
        h('span', { style: { font: "700 11px 'Gaegu',cursive", color: '#9a5e1f', letterSpacing: '1px' } }, 'WHEN'),
        slot(sc, () => this.cycleGal('galleryScope', scopes.length)),
        h('span', { style: { font: "700 14px 'Gaegu',cursive", color: '#b8702a' } }, '→'),
        h('span', { style: { font: "700 11px 'Gaegu',cursive", color: '#9a5e1f', letterSpacing: '1px' } }, 'THEN'),
        slot(nu, () => this.cycleGal('galleryNudge', nudges.length)),
        h('button', { onClick: () => this.toggleGallery(), style: { font: "700 13px 'Gaegu',cursive", padding: '5px 12px', border: '2px solid #2a2a28', borderRadius: '9px', background: '#2a2a28', color: '#fff', cursor: 'pointer' } }, '✓ add rule')),
      h('div', { style: { font: "400 12px 'Gaegu',cursive", color: '#7a746a', marginTop: '8px' } }, 'A rule can never override a 🔒 lock. Most rules are auto-derived from your calendar & locks — you rarely author one.'));
  }

  // ---- BMR / TDEE / daily target, computed from the user's OWN numbers (Mifflin–St Jeor) ----
  // Canonical Mifflin–St Jeor activity factors (sedentary → extra-active), tap to cycle.
  actList() { return [['Sedentary', 1.2], ['Light', 1.375], ['Moderate', 1.55], ['Active', 1.725], ['Athlete', 1.9]]; }
  goalList() { return [['Cut', -500], ['Lean-maintain', -110], ['Maintain', 0], ['Gain', 250]]; }
  bmrCalc() {
    const b = this.state.bmr;
    const bmr = Math.round(10 * b.wt + 6.25 * b.ht - 5 * b.age + (b.sex === 'M' ? 5 : -161));
    const tdee = Math.round(bmr * b.act);
    const target = Math.round((tdee + b.goal) / 10) * 10;
    const protein = Math.max(45, Math.round(b.wt * 0.97 / 5) * 5);
    return { bmr, tdee, target, protein };
  }
  setBmr(key, val) { const n = parseInt(val, 10); this.setState((s) => ({ bmr: { ...s.bmr, [key]: isNaN(n) ? s.bmr[key] : Math.max(1, n) } })); }
  stepBmr(key, d) { this.setState((s) => ({ bmr: { ...s.bmr, [key]: Math.max(1, s.bmr[key] + d) } })); }
  setSex(sex) { this.setState((s) => ({ bmr: { ...s.bmr, sex } })); }
  cycle(key, list) { this.setState((s) => { const i = list.findIndex((x) => x[1] === s.bmr[key]); return { bmr: { ...s.bmr, [key]: list[(i + 1) % list.length][1] } }; }); }

  // the interactive "enter your details" panel that drives the daily target (no longer hardcoded)
  bmrPanel() {
    const h = React.createElement;
    const b = this.state.bmr, c = this.bmrCalc();
    const actName = (this.actList().find((a) => a[1] === b.act) || ['Moderate'])[0];
    const goalName = (this.goalList().find((g) => g[1] === b.goal) || ['Maintain'])[0];
    const chip = { font: "700 13px 'Gaegu',cursive", padding: '5px 11px', border: '2px solid #2a2a28', borderRadius: '9px', background: '#fff' };
    const op = { font: "700 16px 'Gaegu',cursive", color: '#7a746a' };
    const stepBtn = { font: "700 15px 'Gaegu',cursive", width: '26px', height: '29px', border: '2px solid #2a2a28', borderRadius: '7px', background: '#fff', cursor: 'pointer' };
    const col = { display: 'flex', flexDirection: 'column', gap: '3px' };
    const lab = { font: "700 12px 'Gaegu',cursive", color: '#56524a' };
    const num = (label, key, unit) => h('div', { style: col },
      h('span', { style: lab }, label),
      h('div', { style: { display: 'flex', alignItems: 'center', gap: '4px' } },
        h('button', { onClick: () => this.stepBmr(key, -1), title: 'decrease', style: stepBtn }, '−'),
        h('input', { type: 'number', value: b[key], onChange: (e) => this.setBmr(key, e.target.value), style: { width: '54px', font: "700 15px 'Gaegu',cursive", textAlign: 'center', border: '2px solid #2a2a28', borderRadius: '8px', padding: '4px 2px', background: '#fff' } }),
        h('button', { onClick: () => this.stepBmr(key, 1), title: 'increase', style: stepBtn }, '+'),
        h('span', { style: { font: "400 11px 'Gaegu',cursive", color: '#7a746a' } }, unit)));
    const sexBtn = (val, txt) => h('button', { onClick: () => this.setSex(val), style: { font: "700 14px 'Gaegu',cursive", padding: '6px 12px', border: '2px solid #2a2a28', borderRadius: '8px', cursor: 'pointer', background: b.sex === val ? '#2a2a28' : '#fff', color: b.sex === val ? '#fff' : '#2a2a28' } }, txt);
    return h('div', null,
      h('div', { style: { font: "400 13px 'Gaegu',cursive", color: '#56524a', marginBottom: '10px' } }, 'Enter your details — your target is computed live below, not hardcoded.'),
      h('div', { style: { display: 'flex', gap: '16px', flexWrap: 'wrap', alignItems: 'flex-end' } },
        h('div', { style: col }, h('span', { style: lab }, 'Sex'), h('div', { style: { display: 'flex', gap: '5px' } }, sexBtn('F', '♀ Female'), sexBtn('M', '♂ Male'))),
        num('Age', 'age', 'yrs'), num('Height', 'ht', 'cm'), num('Weight', 'wt', 'kg'),
        h('div', { style: col }, h('span', { style: lab }, 'Activity'), h('button', { onClick: () => this.cycle('act', this.actList()), title: 'tap to cycle', style: { ...chip, cursor: 'pointer' } }, actName + ' ×' + b.act + ' ▾')),
        h('div', { style: col }, h('span', { style: lab }, 'Goal'), h('button', { onClick: () => this.cycle('goal', this.goalList()), title: 'tap to cycle', style: { ...chip, cursor: 'pointer' } }, goalName + ' ' + (b.goal > 0 ? '+' + b.goal : b.goal) + ' ▾'))),
      h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center', marginTop: '14px' } },
        h('span', { style: chip }, 'BMR ≈ ' + c.bmr.toLocaleString(), h('span', { style: { fontWeight: 400, color: '#7a746a' } }, ' · Mifflin–St Jeor')),
        h('span', { style: op }, '×'), h('span', { style: chip }, 'activity ' + b.act),
        h('span', { style: op }, '='), h('span', { style: { ...chip, background: '#f3efe6' } }, 'TDEE ≈ ' + c.tdee.toLocaleString()),
        h('span', { style: op }, (b.goal >= 0 ? '+' : '−') + Math.abs(b.goal)), h('span', { style: op }, '→'),
        h('span', { style: { font: "700 14px 'Gaegu',cursive", padding: '6px 12px', border: '2px solid #2f6d4a', borderRadius: '9px', background: '#eef3ec', color: '#2f6d4a' } }, 'target ' + c.target.toLocaleString() + ' kcal · ' + c.protein + 'g protein')));
  }

  // the learned flavour model — 6 axes, each 0..1
  dnaAxes() {
    return [
      { k: 'Spice', v: 0.72 },
      { k: 'Cuisine', v: 0.55 },
      { k: 'Novelty', v: 0.34 },
      { k: 'Price', v: 0.62 },
      { k: 'Protein', v: 0.48 },
      { k: 'Cook/order', v: 0.30 },
    ];
  }
  // a hand-drawn-feel radar/spider chart built in SVG
  radar(size) {
    const h = React.createElement;
    const axes = this.dnaAxes();
    const n = axes.length, cx = size / 2, cy = size / 2, R = size / 2 - 30;
    const pt = (v, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + R * v * Math.cos(a), cy + R * v * Math.sin(a)]; };
    const poly = (v) => axes.map((_, i) => pt(v, i).map((z) => z.toFixed(1)).join(',')).join(' ');
    const rings = [1, 0.66, 0.33].map((rv, i) => h('polygon', { key: 'r' + i, points: poly(rv), fill: i === 0 ? '#faf8f2' : 'none', stroke: '#cfc9bd', strokeWidth: 1.5 }));
    const spokes = axes.map((_, i) => { const [x, y] = pt(1, i); return h('line', { key: 'k' + i, x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), stroke: '#e6e1d6', strokeWidth: 1 }); });
    const shape = h('polygon', { key: 'shape', points: axes.map((a, i) => pt(a.v, i).map((z) => z.toFixed(1)).join(',')).join(' '), fill: 'rgba(109,58,166,.20)', stroke: '#6d3aa6', strokeWidth: 2.5, strokeLinejoin: 'round' });
    const dots = axes.map((a, i) => { const [x, y] = pt(a.v, i); return h('circle', { key: 'c' + i, cx: x.toFixed(1), cy: y.toFixed(1), r: 3, fill: '#6d3aa6' }); });
    const labels = axes.map((a, i) => { const [x, y] = pt(1.14, i); return h('text', { key: 't' + i, x: x.toFixed(1), y: y.toFixed(1), fontSize: size > 200 ? 12 : 10, fontFamily: "'Gaegu',cursive", fontWeight: 700, fill: '#56524a', textAnchor: 'middle', dominantBaseline: 'middle' }, a.k); });
    return h('svg', { width: size, height: size, viewBox: '0 0 ' + size + ' ' + size, style: { display: 'block', margin: '0 auto' } }, ...rings, ...spokes, shape, ...dots, ...labels);
  }

  // 7-day kcal-vs-target bar chart for the Nutrition tab
  nutritionWeek(hgt) {
    const h = React.createElement;
    const target = this.bmrCalc().target, maxS = 2300;
    const data = [['M', 1720], ['T', 1700], ['W', 1640], ['T', 2060], ['F', 1780], ['S', 1980], ['S', 1560]];
    const targetY = Math.round(hgt * (1 - target / maxS));
    const bars = data.map((d, i) => h('div', { key: 'b' + i, title: d[1] + ' kcal', style: { flex: 1, height: Math.round(hgt * d[1] / maxS) + 'px', background: d[1] > target ? '#cf4a2f' : '#6db07a', border: '1.5px solid #2a2a28', borderRadius: '4px 4px 0 0', alignSelf: 'flex-end' } }));
    const labels = data.map((d, i) => h('div', { key: 'l' + i, style: { flex: 1, textAlign: 'center', font: "700 10px 'Gaegu',cursive", color: '#7a746a' } }, d[0]));
    return h('div', null,
      h('div', { style: { position: 'relative', display: 'flex', alignItems: 'flex-end', gap: '5px', height: hgt + 'px', borderBottom: '2px solid #2a2a28' } },
        h('div', { style: { position: 'absolute', left: 0, right: 0, top: targetY + 'px', borderTop: '2px dashed #2f5fd0' } }),
        h('span', { style: { position: 'absolute', right: '2px', top: (targetY - 14) + 'px', font: "700 10px 'Gaegu',cursive", color: '#2f5fd0', background: '#fff', padding: '0 3px' } }, 'target ' + target.toLocaleString()),
        ...bars),
      h('div', { style: { display: 'flex', gap: '5px', marginTop: '3px' } }, ...labels));
  }

  // protein wants an EVEN spread across meals (~daily/3), not backloaded — viz B/L/D
  // against the per-meal dose so a low meal is visible (docs §3.1).
  proteinDist() {
    const h = React.createElement;
    const per = Math.round(this.bmrCalc().protein / 3);
    const data = [['B', 12], ['L', 26], ['D', 18]];
    const hgt = 64, maxv = Math.max(per * 1.7, 30);
    const targetY = Math.round(hgt * (1 - per / maxv));
    const bars = data.map((d, i) => h('div', { key: 'p' + i, title: d[1] + 'g', style: { flex: 1, height: Math.round(hgt * d[1] / maxv) + 'px', background: d[1] < 0.7 * per ? '#cf4a2f' : '#6db07a', border: '1.5px solid #2a2a28', borderRadius: '4px 4px 0 0', alignSelf: 'flex-end' } }));
    const labels = data.map((d, i) => h('div', { key: 'pl' + i, style: { flex: 1, textAlign: 'center', font: "700 10px 'Gaegu',cursive", color: '#7a746a' } }, d[0] + ' ' + d[1] + 'g'));
    return h('div', { style: { marginTop: '12px', borderTop: '2px dashed #cfc9bd', paddingTop: '10px' } },
      h('div', { style: { font: "700 14px 'Gaegu',cursive" } }, 'Protein across the day ', h('span', { style: { font: "400 12px 'Gaegu',cursive", color: '#7a746a' } }, '· aim ~' + per + 'g/meal, evenly')),
      h('div', { style: { position: 'relative', display: 'flex', alignItems: 'flex-end', gap: '6px', height: hgt + 'px', borderBottom: '2px solid #2a2a28', marginTop: '8px' } },
        h('div', { style: { position: 'absolute', left: 0, right: 0, top: targetY + 'px', borderTop: '2px dashed #2f6d4a' } }),
        h('span', { style: { position: 'absolute', right: '2px', top: (targetY - 14) + 'px', font: "700 10px 'Gaegu',cursive", color: '#2f6d4a', background: '#fff', padding: '0 3px' } }, '~' + per + 'g'),
        ...bars),
      h('div', { style: { display: 'flex', gap: '6px', marginTop: '3px' } }, ...labels),
      h('div', { style: { font: "400 12px 'Gaegu',cursive", color: '#7a746a', marginTop: '6px' } }, 'A low breakfast isn’t fixed by a big dinner — protein is used meal-by-meal, so the agent spreads it.'));
  }

  renderVals() {
    const set = (t) => () => this.setState({ tab: t });
    const c = this.bmrCalc();
    // share the computed target with the Weekly screen (read on its next render)
    try { localStorage.setItem('smartplate_target', String(c.target)); localStorage.setItem('smartplate_protein', String(c.protein)); localStorage.setItem('smartplate_favs', JSON.stringify(this.state.favs)); } catch (e) {}
    return {
      isForm: this.state.tab === 'form',
      isDna: this.state.tab === 'dna',
      isNutri: this.state.tab === 'nutri',
      goForm: set('form'), goDna: set('dna'), goNutri: set('nutri'),
      dnaRadar: this.radar(240), dnaRadarMob: this.radar(184),
      nutritionWeekEl: this.nutritionWeek(150), nutritionWeekMobEl: this.nutritionWeek(92),
      proteinDistEl: this.proteinDist(),
      bmrEl: this.bmrPanel(), favsEl: this.favsPanel(),
      ruleGalleryEl: this.ruleGallery(),
      openGallery: () => this.toggleGallery(),
      bmrTargetLabel: 'Target ' + c.target.toLocaleString() + ' kcal · ' + c.protein + 'g protein',
      notes: this.props.showAnnotations ?? true,
    };
  }
}
</script>

  <!-- ===== runtime: mini-React + template interpreter + screen bootstrap (was ./support.js) ===== -->
  <script>
/*
 * SmartPlate wireframe runtime  (the self-contained replacement for the missing ./support.js)
 * --------------------------------------------------------------------------------------------
 * The two ".dc.html" exports were authored against a design-tool runtime ("support.js") that
 * was never shipped with the repo. Without it the templates render as literal "{{ ... }}" text
 * with every interactive component missing. This file re-implements exactly the slice of that
 * runtime the two screens use — nothing more — so the merged wireframe renders offline, with no
 * CDN and no external dependency (which also closes design-audit finding F1, the React-CDN SPOF).
 *
 * What the screens actually use (verified against both files):
 *   - React.createElement (aliased `h`) with HOST tags only (div/span/button/svg/...), no hooks,
 *     no custom React components, no lifecycle, no ReactDOM.
 *   - this.state / this.setState (object or updater fn) on a `DCLogic` base class.
 *   - Template placeholders {{ ident }} / {{ ident.path }} / {{ true|false }}.
 *   - <sc-if value="{{ flag }}">…</sc-if>  and  <sc-for list="{{ arr }}" as="x">…</sc-for>.
 *   - onClick="{{ handler }}" bindings.
 * So this runtime is a ~minimal mini-React + a small template interpreter + a screen bootstrap.
 */
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var SVG_TAGS = { svg: 1, g: 1, path: 1, circle: 1, rect: 1, line: 1, polyline: 1, polygon: 1, ellipse: 1, text: 1, tspan: 1, defs: 1, stop: 1, lineargradient: 1, radialgradient: 1, clippath: 1, use: 1, symbol: 1, marker: 1, mask: 1, pattern: 1, filter: 1, title: 1 };
  // SVG attribute names that must stay camelCase (everything else is kebab-cased).
  var SVG_CAMEL_KEEP = { viewBox: 1, preserveAspectRatio: 1, gradientUnits: 1, gradientTransform: 1, patternUnits: 1, patternContentUnits: 1, spreadMethod: 1, xmlns: 1 };

  function kebab(s) { return s.replace(/[A-Z]/g, function (m) { return '-' + m.toLowerCase(); }); }
  function svgAttr(key) { return SVG_CAMEL_KEEP[key] ? key : (/[A-Z]/.test(key) ? kebab(key) : key); }

  function styleToCss(obj) {
    var out = [];
    for (var k in obj) {
      if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
      var v = obj[k];
      if (v == null) continue;
      out.push(kebab(k) + ':' + (typeof v === 'number' ? String(v) : v));
    }
    return out.join(';');
  }

  // ---- mini-React -------------------------------------------------------------------------
  function isVNode(x) { return x != null && typeof x === 'object' && x.__v === true; }

  function createElement(tag, props) {
    var children = [];
    function add(c) {
      if (c == null || c === false || c === true) return;       // React drops these
      if (Array.isArray(c)) { c.forEach(add); return; }
      children.push(c);
    }
    for (var i = 2; i < arguments.length; i++) add(arguments[i]);
    return { __v: true, tag: tag, props: props || {}, children: children };
  }

  // Turn a vnode (or primitive) into a real DOM node.
  function mount(vnode, parentIsSvg) {
    if (vnode == null || vnode === false || vnode === true) return document.createComment('');
    if (!isVNode(vnode)) return document.createTextNode(String(vnode));

    var tag = vnode.tag, props = vnode.props, children = vnode.children;
    var isSvg = parentIsSvg || tag === 'svg' || !!SVG_TAGS[String(tag).toLowerCase()];
    var el = isSvg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);

    for (var key in props) {
      if (!Object.prototype.hasOwnProperty.call(props, key)) continue;
      var val = props[key];
      if (key === 'key' || key === 'ref') continue;
      if (key === 'style' && val && typeof val === 'object') { el.setAttribute('style', styleToCss(val)); continue; }
      if (/^on[A-Z]/.test(key)) { if (typeof val === 'function') el.addEventListener(key.slice(2).toLowerCase(), val); continue; }
      if (key === 'className') { if (val != null) el.setAttribute('class', String(val)); continue; }
      if (val == null || val === false) continue;
      el.setAttribute(isSvg ? svgAttr(key) : key, val === true ? '' : String(val));
    }
    for (var c = 0; c < children.length; c++) el.appendChild(mount(children[c], isSvg));
    return el;
  }

  // ---- DCLogic base (what the component classes `extends`) ---------------------------------
  function DCLogic(props) { this.props = props || {}; if (!this.state) this.state = {}; }
  DCLogic.prototype.setState = function (patch) {
    var next = (typeof patch === 'function') ? patch(this.state) : patch;
    this.state = Object.assign({}, this.state, next);
    if (typeof this._render === 'function') this._render();
  };

  // ---- template-expression evaluation -----------------------------------------------------
  // Only three forms occur: a bare identifier, a dotted path (inside sc-for), or true/false.
  function stripBraces(s) {
    if (s == null) return '';
    var m = /\{\{([\s\S]*?)\}\}/.exec(s);
    return (m ? m[1] : s).trim();
  }
  function evalExpr(expr, scope) {
    expr = String(expr).trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (expr === '') return '';
    var parts = expr.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i].trim()]; }
    return v;
  }
  // String interpolation for attribute values (placeholders here are always primitives).
  function interp(str, scope) {
    return String(str).replace(/\{\{([^}]*)\}\}/g, function (_, e) {
      var v = evalExpr(e, scope);
      return v == null ? '' : String(v);
    });
  }

  // ---- template interpreter ---------------------------------------------------------------
  // Walk a parsed source node and produce output DOM node(s), substituting `scope` values.
  // Returns an array because sc-for fans out and sc-if can collapse to nothing.
  function build(src, scope, parentIsSvg) {
    if (src.nodeType === 3) return processText(src.nodeValue, scope); // text
    if (src.nodeType !== 1) return [];                                // comments / other → drop

    var tag = src.tagName.toLowerCase();

    if (tag === 'sc-if') {
      return evalExpr(stripBraces(src.getAttribute('value')), scope) ? buildChildren(src, scope, parentIsSvg) : [];
    }
    if (tag === 'sc-for') {
      var list = evalExpr(stripBraces(src.getAttribute('list')), scope) || [];
      var as = (src.getAttribute('as') || 'item').trim();
      var out = [];
      for (var i = 0; i < list.length; i++) {
        var childScope = Object.assign({}, scope);
        childScope[as] = list[i];
        childScope[as + 'Index'] = i;
        out = out.concat(buildChildren(src, childScope, parentIsSvg));
      }
      return out;
    }

    var isSvg = parentIsSvg || src.namespaceURI === SVG_NS || tag === 'svg';
    var el = isSvg ? document.createElementNS(SVG_NS, src.localName) : document.createElement(tag);

    var attrs = src.attributes;
    for (var a = 0; a < attrs.length; a++) {
      var name = attrs[a].name, value = attrs[a].value;
      var lower = name.toLowerCase();
      if (lower === 'onclick') {
        var fn = evalExpr(stripBraces(value), scope);
        if (typeof fn === 'function') el.addEventListener('click', fn);
        continue;
      }
      if (lower === 'hint-placeholder-val' || lower === 'hint-placeholder-count') continue; // design-tool hints
      el.setAttribute(name, interp(value, scope));
    }

    var kids = src.childNodes;
    for (var c = 0; c < kids.length; c++) {
      var built = build(kids[c], scope, isSvg);
      for (var b = 0; b < built.length; b++) el.appendChild(built[b]);
    }
    return [el];
  }

  function buildChildren(src, scope, parentIsSvg) {
    var kids = src.childNodes, out = [];
    for (var c = 0; c < kids.length; c++) out = out.concat(build(kids[c], scope, parentIsSvg));
    return out;
  }

  // A text node may interleave literal text with {{ }} placeholders. A placeholder can resolve
  // to a primitive (→ text) or to a vnode / array of vnodes (→ mounted React subtree).
  function processText(text, scope) {
    var parts = [], re = /\{\{([^}]*)\}\}/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parts.push(document.createTextNode(text.slice(last, m.index)));
      var v = evalExpr(m[1], scope);
      if (isVNode(v)) parts.push(mount(v));
      else if (Array.isArray(v)) v.forEach(function (x) { parts.push(isVNode(x) ? mount(x) : document.createTextNode(x == null ? '' : String(x))); });
      else if (v != null && v !== false && v !== true) parts.push(document.createTextNode(String(v)));
      last = re.lastIndex;
    }
    if (last < text.length) parts.push(document.createTextNode(text.slice(last)));
    return parts;
  }

  // ---- screen wiring ----------------------------------------------------------------------
  function loadComponentClass(scriptText) {
    // Each screen's logic is `class Component extends DCLogic {…}`; eval it in a private scope.
    return new Function('DCLogic', 'React', 'ReactDOM', scriptText + '\n;return Component;')(
      DCLogic, { createElement: createElement }, {}
    );
  }

  function makeScreen(container, templateEl, ComponentClass, getNotes) {
    var comp = new ComponentClass({ showAnnotations: getNotes() });
    comp._container = container;
    var source = templateEl.content;
    comp._render = function () {
      comp.props.showAnnotations = getNotes();
      var vals = comp.renderVals();
      var frag = document.createDocumentFragment();
      var nodes = source.childNodes;
      for (var i = 0; i < nodes.length; i++) {
        var built = build(nodes[i], vals, false);
        for (var b = 0; b < built.length; b++) frag.appendChild(built[b]);
      }
      container.replaceChildren(frag);
    };
    comp._render();
    return comp;
  }

  function boot() {
    var notesToggle = document.getElementById('dc-notes');
    var getNotes = function () { return notesToggle ? !!notesToggle.checked : true; };

    var comps = [];
    var screens = document.querySelectorAll('.dc-screen');
    for (var i = 0; i < screens.length; i++) {
      var container = screens[i];
      var tpl = document.getElementById(container.getAttribute('data-template'));
      var logic = document.getElementById(container.getAttribute('data-logic'));
      if (!tpl || !logic) continue;
      try {
        comps.push(makeScreen(container, tpl, loadComponentClass(logic.textContent), getNotes));
      } catch (err) {
        container.innerHTML = '<pre style="color:#cf4a2f;font:14px monospace;white-space:pre-wrap;padding:16px;">Failed to render screen: ' + String(err && err.stack || err) + '</pre>';
        if (typeof console !== 'undefined') console.error('[dc] screen render failed', err);
      }
    }

    // top-level tab bar: switch which screen is visible
    var tabs = document.querySelectorAll('.dc-tab');
    function activate(targetId) {
      for (var s = 0; s < screens.length; s++) screens[s].style.display = (screens[s].id === targetId) ? '' : 'none';
      // re-render the screen we're showing so cross-screen values (e.g. the BMR target) refresh
      comps.forEach(function (c) { if (c._container && c._container.id === targetId) { try { c._render(); } catch (e) {} } });
      for (var t = 0; t < tabs.length; t++) tabs[t].setAttribute('data-active', tabs[t].getAttribute('data-target') === targetId ? 'true' : 'false');
    }
    for (var t = 0; t < tabs.length; t++) {
      (function (btn) { btn.addEventListener('click', function () { activate(btn.getAttribute('data-target')); }); })(tabs[t]);
    }
    if (tabs.length) activate(tabs[0].getAttribute('data-target'));

    // notes (red annotations) toggle: re-render every screen
    if (notesToggle) notesToggle.addEventListener('change', function () { comps.forEach(function (c) { c._render(); }); });

    // expose a tiny handle for tests / debugging
    window.__dc = { comps: comps, activate: activate };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

  </script>
</body>
</html>
