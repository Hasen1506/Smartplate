# Select this Blueprint file explicitly in Render after reviewing cost and migration.
# It targets the existing smartplate service. Keep real placement off until the
# exact callback is whitelisted and a supervised staging order has passed.
services:
  - type: web
    name: smartplate
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt && python scripts/fetch_epicure.py
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /readyz
    autoDeployTrigger: checksPass
    disk:
      name: smartplate-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SMARTPLATE_DB
        value: /var/data/smartplate.db
      - key: SMARTPLATE_SECRET
        generateValue: true
      - key: SMARTPLATE_PUBLIC_URL
        value: https://smartplate-xgxd.onrender.com
      - key: SMARTPLATE_SWIGGY_CALLBACK_PATH
        value: /swiggy/callback
      - key: SMARTPLATE_SWIGGY
        value: live
      - key: SMARTPLATE_LIVE_ORDERS
        value: off
      - key: SMARTPLATE_PUSH_CONTACT
        sync: false
