name: SmartPlate checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:                          # a newer push supersedes a running check of the same ref
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci          # derandomized, no example database: identical runs everywhere
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the differential suite reads the pre-#19 and #19 trees from history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.txt --strict
      - name: Unit and property tests
        timeout-minutes: 3
        run: >-
          python -m pytest -q -n auto --durations=10
          --ignore=tests/test_gt_golden_planner.py --ignore=tests/test_gt_journey.py
          --ignore=tests/test_gt_differential.py
      - name: Golden and differential tests
        timeout-minutes: 3
        run: python -m pytest -q -n auto --durations=10 tests/test_gt_golden_planner.py tests/test_gt_journey.py tests/test_gt_differential.py
      - run: node --check smartplate/static/app.js
      - run: node src/sourcing/menu-source.test.js
      - run: node --test tests/frontend.test.cjs
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser E2E (golden first-week journey, smoke, household, Epicure swaps, Ziggy redesign 375/1280 light+dark, live-only production mode)
        timeout-minutes: 5
        run: python -m pytest -q tests/browser_journey.py tests/browser_smoke.py tests/browser_household.py tests/browser_epicure.py tests/browser_redesign.py tests/browser_live_only.py tests/browser_pools.py --durations=10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screens
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  # The same Python suite against Postgres (DATABASE_URL / Neon): a local service
  # container, one schema per test, so it stays offline and deterministic.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      HYPOTHESIS_PROFILE: ci
      PYTHONHASHSEED: "0"
      SMARTPLATE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartplate_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit and property tests on Postgres
        timeout-minutes: 8
        run: >-
          python -m pytest -q -n auto --durations=10
          --ignore=tests/test_gt_golden_planner.py --ignore=tests/test_gt_journey.py
          --ignore=tests/test_gt_differential.py
      - name: Golden and differential tests on Postgres
        timeout-minutes: 5
        run: python -m pytest -q -n auto --durations=10 tests/test_gt_golden_planner.py tests/test_gt_journey.py tests/test_gt_differential.py
