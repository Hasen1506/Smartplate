name: SmartPlate checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check smartplate/static/app.js
      - run: node --check smartplate/static/live-core.js
      - run: node src/sourcing/menu-source.test.js
      - run: node --test tests/frontend.test.cjs
      - run: python -m pip install mcp==2.2.0
      - run: python -m pytest -q tests/mcp_interop.py
      - run: python -m pip install playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screens
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 3
