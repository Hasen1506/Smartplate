# One-click hosting on Render: https://render.com/deploy?repo=https://github.com/Hasen1506/Smartplate
# The free plan sleeps after ~15 minutes idle (first visit then takes ~1 minute) and
# its disk is wiped on every restart or redeploy. To keep profiles, plans and Swiggy
# links at no cost, set DATABASE_URL to a free Neon Postgres database (README:
# "Keep your data: free Postgres on Neon"); the app then stores everything there.
# Without DATABASE_URL it falls back to SQLite on the temporary disk (a demo).
services:
  - type: web
    name: smartplate
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python scripts/fetch_epicure.py
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SMARTPLATE_SECRET
        generateValue: true
      - key: SMARTPLATE_SWIGGY
        value: simulated
      - key: DATABASE_URL            # Neon connection string; a secret, so it is never in git.
        sync: false                  # New Blueprints prompt for it; existing services: set it in
                                     # Render -> smartplate -> Environment (see README).
