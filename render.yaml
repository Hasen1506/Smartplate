services:
  - type: web
    name: smartplate-beta
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: SMARTPLATE_MODE
        value: production
      - key: SMARTPLATE_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SMARTPLATE_INVITED_EMAILS
        sync: false
      - key: SMARTPLATE_PUBLIC_BASE_URL
        sync: false
